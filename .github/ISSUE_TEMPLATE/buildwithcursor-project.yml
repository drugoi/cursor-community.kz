name: "#buildwithcursor Project Submission"
description: Submit a project to the #buildwithcursor showcase (Kazakhstan)
title: "[#buildwithcursor] "
labels: ["buildwithcursor"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting your project to the **#buildwithcursor** showcase! 🚀
        Projects built with Cursor by developers in Kazakhstan will be featured on [cursor-community.kz](https://cursor-community.kz).

        Please fill in all fields below. After review, your project will be added to the showcase.

  - type: input
    id: title
    attributes:
      label: Project Title
      description: The name of your project
      placeholder: "My Awesome App"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Brief description of your project (what it does, tech stack, etc.)
      placeholder: |
        A web app that helps developers...
        Built with Next.js, TypeScript, and Cursor.
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Project URL
      description: Link to your project (live demo, repository, or landing page)
      placeholder: "https://myproject.com"
    validations:
      required: true

  - type: input
    id: image
    attributes:
      label: Image URL
      description: URL to a screenshot or preview image of your project (recommended 16:9 aspect ratio, min 640×360px)
      placeholder: "https://example.com/screenshot.png"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        **Note:** Image can be hosted on your repo (e.g. `https://raw.githubusercontent.com/user/repo/main/screenshot.png`), Imgur, or any public URL. The image will be displayed in the showcase.
